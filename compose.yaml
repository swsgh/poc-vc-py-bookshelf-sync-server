name: bookshelf

services:
  bookshelf-sync-server:
    container_name: bookshelf
    image: python:3.13-slim
    working_dir: /data
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPEN_LIBRARY_CONTACT_EMAIL: ${OPEN_LIBRARY_CONTACT_EMAIL:?Set OPEN_LIBRARY_CONTACT_EMAIL in .env}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:?Set GOOGLE_BOOKS_API_KEY in .env}
      BOOK_COVER_CACHE_DIR: /data/covers
    volumes:
      - .:/app:ro
      - ./data:/data
    command:
      - sh
      - -c
      - >-
        python -m pip install --no-cache-dir -r /app/requirements.txt &&
        exec python -m uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000
